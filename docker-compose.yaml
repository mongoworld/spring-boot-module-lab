# 실습용 PostgreSQL. dew 와 같은 버전(18.6)으로 맞춰 dew 코드와 비교하기 쉽게 한다.
services:
  postgres:
    image: postgres:18.6
    container_name: learn-pg
    ports:
      # 이 맥 안에서만 접속하게 루프백에만 연다. 5432·5433 은 다른 DB 가 쓰고 있어 5434 를 쓴다.
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_DB: learn
      POSTGRES_USER: learn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (.env)}
    volumes:
      # PostgreSQL 18 이미지는 데이터 경로가 /var/lib/postgresql/18/docker 라 상위 경로를 연결해야 데이터가 남는다
      - learn-pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U learn -d learn"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  learn-pg-data:
